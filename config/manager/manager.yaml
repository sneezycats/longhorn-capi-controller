apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-capi-system
  labels:
    app.kubernetes.io/name: longhorn-capi-controller
    app.kubernetes.io/component: controller
    control-plane: longhorn-capi-eviction-controller

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-capi-eviction-controller
  namespace: longhorn-capi-system
  labels:
    app.kubernetes.io/name: longhorn-capi-controller
    app.kubernetes.io/component: controller
    control-plane: longhorn-capi-eviction-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: longhorn-capi-eviction-controller
  template:
    metadata:
      labels:
        control-plane: longhorn-capi-eviction-controller
        app.kubernetes.io/name: longhorn-capi-controller
    spec:
      serviceAccountName: longhorn-capi-eviction-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: docker.io/mcclurken/longhorn-capi-controller:0.9-alpha
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            # Eviction + replica-rebuild timeout. Low for lab tests (small volumes);
            # raise for larger volumes (the KB recommends ≥4h for 500 GB volumes).
            - --eviction-timeout=20m
            - --poll-interval=15s
            - --longhorn-namespace=longhorn-system
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
