apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-capi-system
resources:
  # RBAC first (ServiceAccount, roles, bindings), then the workload resources.
  - ../rbac
  - manager.yaml
labels:
  - pairs:
      app.kubernetes.io/name: longhorn-capi-controller
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
images:
  - name: ghcr.io/sneezycats/longhorn-capi-controller
    newTag: 0.11.1
