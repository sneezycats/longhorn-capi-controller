# ClusterRole to apply inside EACH workload cluster where Longhorn is installed.
# The controller authenticates to workload clusters via the per-cluster kubeconfig
# Secret (<cluster>-kubeconfig); bind whatever identity that kubeconfig carries
# to this role (see the subjects below).
#
# Apply with:
#   kubectl --kubeconfig <workload-kubeconfig> apply -f workload_role.yaml
#
# Or via Fleet/ArgoCD bundle targeting workload clusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-capi-eviction-workload
  labels:
    app.kubernetes.io/name: longhorn-capi-controller
    app.kubernetes.io/component: workload-rbac
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["longhorn.io"]
    resources: ["nodes/finalizers"]
    verbs: ["update"]
  - apiGroups: ["longhorn.io"]
    resources: ["nodes/status"]
    verbs: ["get"]
  # Rebuild-completion gate: list replicas + volumes to verify rebuild; DELETE a
  # replica that sits on a CAPI-deleting node to force a rebuild onto a healthy node.
  - apiGroups: ["longhorn.io"]
    resources: ["replicas"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch"]
  # EvictStuckPods (post-release attachment cleanup): cordon the departing node
  # and force-delete workload pods holding Longhorn PVCs. Requires Pod list/
  # delete (cluster-wide: pods land in every namespace), PVC lookup (to map a
  # pod's claim to its Longhorn volume), and core Node patch (cordon).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-capi-eviction-workload
  labels:
    app.kubernetes.io/name: longhorn-capi-controller
    app.kubernetes.io/component: workload-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-capi-eviction-workload
subjects:
  # Bind the identity that appears INSIDE the workload cluster kubeconfig
  # Secret (<cluster>-kubeconfig) — the credential this controller uses to
  # talk to that cluster. Rancher-provisioned clusters use a Rancher-issued
  # user (u-…); the CAPI default kubeconfig uses the bootstrap admin or a
  # dedicated ServiceAccount. Replace before applying.
  - kind: User
    name: REPLACE_WITH_KUBECONFIG_IDENTITY

# NOTE: there is deliberately no namespaced (Role) variant of this file:
# EvictStuckPods lists and deletes pods across every namespace and cordons
# cluster-scoped Nodes, which cannot be expressed as a single namespaced Role.
